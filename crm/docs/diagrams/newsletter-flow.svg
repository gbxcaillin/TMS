<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" role="img" aria-label="Newsletter send, from compose to inbox">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22389A"/></marker></defs>
<rect width="960" height="310" fill="#F5F6F8"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Newsletter send, from compose to inbox</text>
<rect x="24" y="60" width="140" height="70" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="94.0" y="81.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Compose</text><text x="94.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">audience, format,</text><text x="94.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">subject</text><line x1="164" y1="95" x2="176" y2="95" stroke="#22389A" stroke-width="1.6" marker-end="url(#a)"/><rect x="176" y="60" width="140" height="70" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="246.0" y="81.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Preview + test</text><text x="246.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">instant, to your</text><text x="246.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">own inbox</text><line x1="316" y1="95" x2="328" y2="95" stroke="#22389A" stroke-width="1.6" marker-end="url(#a)"/><rect x="328" y="60" width="140" height="70" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="398.0" y="88.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Send</text><text x="398.0" y="104.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">confirm the count</text><line x1="468" y1="95" x2="480" y2="95" stroke="#22389A" stroke-width="1.6" marker-end="url(#a)"/><rect x="480" y="60" width="140" height="70" fill="#E6F0EC" stroke="#22389A" stroke-width="1.2"/><text x="550.0" y="81.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Queue</text><text x="550.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">one row per recipient</text><text x="550.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">saved in the database</text><line x1="620" y1="95" x2="632" y2="95" stroke="#22389A" stroke-width="1.6" marker-end="url(#a)"/><rect x="632" y="60" width="140" height="70" fill="#E6F0EC" stroke="#22389A" stroke-width="1.2"/><text x="702.0" y="81.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Background sender</text><text x="702.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">2 a second, resumes</text><text x="702.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">after a restart</text><line x1="772" y1="95" x2="784" y2="95" stroke="#22389A" stroke-width="1.6" marker-end="url(#a)"/><rect x="784" y="60" width="140" height="70" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="854.0" y="81.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Resend</text><text x="854.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">delivers, reports</text><text x="854.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">bounces</text><line x1="500" y1="130" x2="220" y2="180" stroke="#22389A" stroke-width="1.6" marker-end="url(#a)"/><line x1="864" y1="130" x2="560" y2="180" stroke="#22389A" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="180" width="290" height="70" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="169.0" y="201.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Sends card in the app</text><text x="169.0" y="217.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">progress bar, cancel, retry failed,</text><text x="169.0" y="231.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">report, bell when it finishes</text><rect x="340" y="180" width="290" height="70" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="485.0" y="201.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Unsubscribe and bounces</text><text x="485.0" y="217.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">one-click link and headers on every email;</text><text x="485.0" y="231.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">bounces and complaints are suppressed</text><rect x="656" y="180" width="280" height="70" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="796.0" y="201.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Personalisation</text><text x="796.0" y="217.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">{{name}} becomes the first name;</text><text x="796.0" y="231.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">replies go to the sender</text><text x="24" y="288" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">10,000 recipients take about 85 minutes. Leaving the page or restarting the server does not stop or repeat a send.</text>
<text x="936" y="300" text-anchor="end" font-size="9.5" fill="#8A919C" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Acme CRM · training diagram</text>
</svg>