ca,Arial,sans-serif">07:30 digest,</text><text x="616.0" y="104.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">push and email</text><line x1="716" y1="88" x2="772" y2="88" stroke="#22389A" stroke-width="1.6" marker-end="url(#a)"/><rect x="772" y="60" width="164" height="56" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="854.0" y="81.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Completed</text><text x="854.0" y="97.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">tick the box</text><line x1="854" y1="116" x2="854" y2="156" stroke="#22389A" stroke-width="1.6" marker-end="url(#a)"/><rect x="660" y="156" width="276" height="56" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="798.0" y="177.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Creator and notify list told</text><text x="798.0" y="193.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">logged on the deal timeline</text><rect x="24" y="156" width="436" height="56" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.2"/><text x="242.0" y="170.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1E293B" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Personal preferences win</text><text x="242.0" y="186.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Settings, Notifications switches any channel off per event;</text><text x="242.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">quiet hours hold push alerts</text><text x="24" y="248" font-size="10.5" fill="#4B5563" style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif">Repeat tasks create the next occurrence on completion. Tasks tied to a deal appear on the deal page and the dashboard.</text>
