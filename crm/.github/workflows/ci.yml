# Runs the test suite (tests/*.test.js) on every pull request and on main: offline browser tests against the page
# source, and server tests against a built app with a throwaway database. No secrets and no network services needed.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server dependencies
        run: npm install --no-audit --no-fund
        working-directory: server
      - name: Test dependencies and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
        working-directory: tests
      - name: Syntax check the server
        run: for f in server/*.js server/lib/*.js server/routes/*.js; do node --check "$f"; done
      - name: Build
        run: sh build.sh
      - name: Tests
        run: node tests/run.js
