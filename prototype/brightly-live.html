<title>Brightly Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&family=Manrope:wght@400;500;600;700&family=Ubuntu+Mono:wght@400;700&display=swap">
<style>
/* Layout: fixed Space Cadet navigation rail, cool work area; raspberry only for actions, the active item and figures that matter. */
:root{
  --raspberry:#F50D74;--garnet:#990A4E;--cadet:#123559;
  --primary:#123559;--primary-hover:#1B4470;--logo-bg:#123559;
  --accent:#F50D74;--accent-hover:#D90B66;--accent-ink:#990A4E;--accent-tint:#FDE7F1;--accent-tint-2:#FBCDE1;
  --rail:#123559;--rail-2:#1B4470;--rail-text:#A9BAD0;--rail-line:rgba(255,255,255,.09);
  --bg:#F4F6FA;--surface:#FFFFFF;--surface-2:#EDF1F6;--surface-3:#E3E9F1;--line:#DFE5EE;--line-2:#C7D1DE;
  --ink:#123559;--ink-2:#3D5573;--ink-3:#6F819A;
  --good:#17754C;--good-tint:#E3F4EC;--on-good:#FFFFFF;--warn:#8A5A00;--warn-tint:#FCF1D9;--bad:#B3261E;--bad-tint:#FBE6E4;--info:#1D5F9E;--info-tint:#E4EEF9;
  --overlay:rgba(18,53,89,.45);
  --font-head:'Ubuntu',system-ui,sans-serif;--font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--font-mono:'Ubuntu Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#2A5C8F;--primary-hover:#3A6DA3;--logo-bg:#123559;
  --accent:#FF2F86;--accent-hover:#FF5A9E;--accent-ink:#FF84B8;--accent-tint:#3A1330;--accent-tint-2:#4C1A3F;
  --rail:#0B1D31;--rail-2:#13304F;
  --bg:#0A1726;--surface:#102339;--surface-2:#15304D;--surface-3:#1B3A5C;--line:#1F3A58;--line-2:#2C4D72;
  --ink:#E9EFF7;--ink-2:#C2D0E2;--ink-3:#8FA3BC;
  --good:#5FD09C;--good-tint:#10352A;--on-good:#0A1726;--warn:#F0C060;--warn-tint:#3A2D10;--bad:#FF8A80;--bad-tint:#3D1A1A;--info:#8CC0F5;--info-tint:#132F4D;
  --overlay:rgba(0,0,0,.6);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --primary:#2A5C8F;--primary-hover:#3A6DA3;--logo-bg:#123559;
  --accent:#FF2F86;--accent-hover:#FF5A9E;--accent-ink:#FF84B8;--accent-tint:#3A1330;--accent-tint-2:#4C1A3F;
  --rail:#0B1D31;--rail-2:#13304F;
  --bg:#0A1726;--surface:#102339;--surface-2:#15304D;--surface-3:#1B3A5C;--line:#1F3A58;--line-2:#2C4D72;
  --ink:#E9EFF7;--ink-2:#C2D0E2;--ink-3:#8FA3BC;
  --good:#5FD09C;--good-tint:#10352A;--on-good:#0A1726;--warn:#F0C060;--warn-tint:#3A2D10;--bad:#FF8A80;--bad-tint:#3D1A1A;--info:#8CC0F5;--info-tint:#132F4D;
  --overlay:rgba(0,0,0,.6);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:400;line-height:1.15;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:30px}h2{font-size:19px}h3{font-size:16px;font-weight:500}
p{margin:0}
input,button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent-ink);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* Demo strip */
.demo{background:var(--cadet);color:#fff;font-size:12.5px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 16px;text-align:center}
.demo button{color:#fff;text-decoration:underline;font-size:12.5px}

/* Sign in */
.login{min-height:calc(100vh - 32px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.login-form{display:grid;place-items:center;padding:32px 16px;background:var(--surface)}
.login-card{width:min(360px,100%);display:flex;flex-direction:column;gap:16px}
.login-art{background:var(--cadet);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-art .big{font-family:var(--font-head);font-size:clamp(30px,4vw,48px);line-height:1.08;max-width:12ch;color:#fff}
.login-art .big em{font-style:normal;color:var(--raspberry)}
.login-art .flower{position:absolute;right:-90px;bottom:-90px;width:360px;opacity:.95}
@media (max-width:820px){.login{grid-template-columns:minmax(0,1fr)}.login-art{padding:28px 20px;min-height:220px}.login-art .flower{width:200px;right:-50px;bottom:-60px}}

/* Shell */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100% - 32px)}
.rail{background:var(--rail);color:#fff;display:flex;flex-direction:column;gap:14px;padding:18px 10px 12px;position:sticky;top:0;height:calc(100vh - 32px);overflow-y:auto}
.rail .brand{display:flex;align-items:center;gap:10px;padding:0 10px 14px;border-bottom:1px solid var(--rail-line);color:#fff}
.rail .brand b{font-family:var(--font-head);font-weight:700;font-size:21px;letter-spacing:-.02em}
.rail nav{display:flex;flex-direction:column;gap:1px}
.rail .group{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-text);opacity:.75;padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--rail-text);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-left:2px solid transparent;text-align:left;width:100%}
.nav:hover{color:#fff;background:var(--rail-2)}
.nav[aria-current="page"]{color:#fff;background:var(--rail-2);border-left-color:var(--raspberry)}
.nav svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4;flex:none}
.nav .count{margin-left:auto;background:var(--raspberry);color:#fff;font-size:10.5px;letter-spacing:0;padding:0 6px;line-height:17px;border-radius:9px}
.rail .foot{margin-top:auto;border-top:1px solid var(--rail-line);padding:10px 6px 0;display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font-size:13px;font-weight:600;color:#fff}.who span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-text)}
.switch{font-size:11.5px;color:var(--rail-text);display:flex;flex-direction:column;gap:4px}
.switch select{background:var(--rail-2);color:#fff;border:1px solid var(--rail-line);padding:5px 6px;font-size:12px}
.av{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.av.alt{background:var(--surface-3);color:var(--ink)}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:54px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.crumb{font-family:var(--font-head);font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb a{color:var(--ink-3)}.crumb .sep{color:var(--ink-3);margin:0 8px}
.top .sp{flex:1}
.search{position:relative;width:min(400px,42vw)}
.search input{width:100%;height:34px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px 0 30px}
.search>svg{position:absolute;left:9px;top:9px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.5}
.page{padding:24px clamp(16px,3vw,32px) 56px;display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head .sub{color:var(--ink-2);margin-top:6px;max-width:74ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 12px;gap:8px}
  .rail .brand{border:0;padding:0}.rail .brand b{display:none}
  .rail nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0}.rail .group{display:none}
  .nav{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.nav[aria-current="page"]{border-bottom-color:var(--raspberry)}
  .rail .foot{display:none}.top{padding:0 16px}.search{display:none}
}

/* Parts */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-good{background:var(--good);border-color:var(--good);color:var(--on-good)}.btn-good:hover{background:var(--good);filter:brightness(1.07)}
.btn-quiet{border-color:transparent;background:transparent}
.btn-sm{height:28px;padding:0 10px;font-size:10.5px}
.btn-ms{height:42px;width:100%;background:var(--surface);gap:10px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.card-body{padding:16px 18px}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-tint);color:var(--good)}.chip.warn{background:var(--warn-tint);color:var(--warn)}.chip.bad{background:var(--bad-tint);color:var(--bad)}.chip.info{background:var(--info-tint);color:var(--info)}.chip.brand{background:var(--accent-tint);color:var(--accent-ink)}
.chip.live .dot{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1060px){.split{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));background:var(--surface);border:1px solid var(--line)}
.fig{padding:16px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.fig:first-child{border-left:0}
.fig .v{font-family:var(--font-head);font-size:28px;font-variant-numeric:tabular-nums}
.fig .v small{font-size:15px;color:var(--ink-3)}
@media (max-width:760px){.fig{border-left:0;border-top:1px solid var(--line)}.fig:first-child{border-top:0}}

.list{list-style:none;margin:0;padding:0}
.list>li{border-top:1px solid var(--line)}.list>li:first-child{border-top:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;width:100%;text-align:left;color:inherit;min-width:0}
button.item:hover,a.item:hover{background:var(--surface-2);text-decoration:none}
.item .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{flex:none;text-align:right;font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.time{flex:none;width:62px;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--ink)}
.time span{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.r{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sec td{background:var(--surface-2);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:7px 14px}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.sub td{font-weight:600}
td.dim{color:var(--ink-3)}
.fee-head th{background:var(--cadet);color:#fff}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{color:var(--ink-3);font-weight:400;margin-left:4px;letter-spacing:0}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.fact{padding:12px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.fact:first-child{border-left:0}
.fact .v{font-weight:700;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
@media (max-width:760px){.fact{border-left:0;border-top:1px solid var(--line)}.fact:first-child{border-top:0}}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--ink-3)}dl.kv dd{margin:0;overflow-wrap:anywhere}

.note{border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;color:var(--ink-2)}
.note.bad{border-left-color:var(--bad)}
.error{border:1px solid var(--bad);background:var(--bad-tint);color:var(--bad);padding:10px 14px}

.src{border-bottom:1px dotted var(--ink-3);cursor:help}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 18px;border-top:1px solid var(--line);font-size:13.5px}
.flag:first-child{border-top:0}

/* Tools */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);background:var(--surface);text-align:left;color:inherit}
.tool:hover{border-color:var(--accent)}
.tool.first{border-color:var(--accent-tint-2)}
.tool .ico{width:36px;height:36px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent-ink)}
.tool .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5}
.tool p{color:var(--ink-2);font-size:13px}
.tool .outs{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.tool .outs span{font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);padding:1px 7px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.form .span{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.input,.select,.textarea{width:100%;min-width:0;height:36px;padding:0 10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:0}
.textarea{height:auto;min-height:90px;padding:8px 10px;resize:vertical;line-height:1.45}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.drop{border:1px dashed var(--line-2);background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:10px}
.drop.over{border-color:var(--accent);background:var(--accent-tint)}
.files{display:flex;flex-wrap:wrap;gap:6px}
.file{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:2px 4px 2px 8px;font-size:12.5px;max-width:100%}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file button{width:20px;height:20px;color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-3)}
.feed{list-style:none;margin:0;padding:6px 0;max-height:60vh;overflow:auto}
.feed li{display:grid;grid-template-columns:62px 14px minmax(0,1fr);gap:8px;padding:5px 18px;font-size:13px}
.feed time{color:var(--ink-3);font-family:var(--font-mono);font-size:12px;padding-top:1px}
.feed .d{width:7px;height:7px;border-radius:50%;background:var(--line-2);margin-top:7px}
.feed .k-tool .d{background:var(--info)}.feed .k-text .d{background:var(--accent)}.feed .k-end .d{background:var(--good)}
.feed .k-tool .m,.feed .k-status .m{color:var(--ink-2)}
.feed .m{overflow-wrap:anywhere}
.doc{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.doc:first-child{border-top:0}
.doc .ext{width:38px;height:38px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-2);flex:none}
.doc .b{flex:1;min-width:170px}.doc .n{font-weight:600;overflow-wrap:anywhere}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.doc form{flex-basis:100%;display:flex;flex-direction:column;gap:8px}
.summary{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
mark{background:var(--warn-tint);color:var(--warn);padding:0 2px}

/* Tasks */
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 18px}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent}
.check:hover{border-color:var(--good)}
.check.done{background:var(--good);border-color:var(--good);color:var(--on-good)}
.check svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2}
.task.is-done .t{text-decoration:line-through;color:var(--ink-3)}
.task.hi{box-shadow:inset 3px 0 0 var(--accent)}
.grouphead{padding:8px 18px;background:var(--surface-2);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between}
.grouphead.over{color:var(--bad)}

/* Calendar */
.week{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));min-width:780px}
.day{border-left:1px solid var(--line);min-height:420px;display:flex;flex-direction:column}
.day:first-child{border-left:0}
.day header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.day header b{font-family:var(--font-head);font-size:20px;font-weight:400}
.day.today header b{background:var(--primary);color:#fff;padding:0 8px;min-width:32px;text-align:center}
.day .evs{display:flex;flex-direction:column;gap:6px;padding:8px}
.ev{padding:7px 9px;background:var(--surface-2);border-left:3px solid var(--line-2);font-size:12.5px;text-align:left;display:flex;flex-direction:column;gap:1px;color:var(--ink);width:100%}
.ev.client{background:var(--accent-tint);border-left-color:var(--accent)}
.ev .t{font-family:var(--font-mono);font-weight:700}

/* Inbox + chat */
.inbox{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);min-height:540px}

<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW=new Date();
const day=n=>{const d=new Date(NOW);d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d};
const at=(n,h,m=0)=>{const d=day(n);d.setHours(h,m);return d};
const ago=mins=>new Date(NOW.getTime()-mins*60000);
const fmtDate=d=>!d?'—':new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
const fmtShort=d=>!d?'—':new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const fmtTime=d=>d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});
const rel=d=>{const m=Math.round((NOW-d)/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';const dd=Math.round(h/24);return dd<7?dd+'d ago':fmtShort(d)};
const daysTo=d=>!d?Infinity:Math.round((new Date(d).setHours(0,0,0,0)-day(0))/864e5);
const due=d=>{if(!d)return'—';d=new Date(d);const n=daysTo(d);if(n<-1)return`${-n} days overdue`;if(n===-1)return'Yesterday';if(n===0)return'Today';if(n===1)return'Tomorrow';if(n<7)return d.toLocaleDateString('en-AU',{weekday:'long'});return fmtShort(d)};
const money=(n,dp=0)=>n==null?'—':(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const big=n=>n>=1e6?'$'+(n/1e6).toFixed(2)+'m':'$'+Math.round(n/1000)+'k';
const pct=(n,dp=2)=>(n*100).toFixed(dp)+'%';
const initials=n=>n.replace(/&/g,' ').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const chip=(label,cls='')=>`<span class="chip ${cls}"><span class="dot"></span>${esc(label)}</span>`;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
const ICON={
  dashboard:'<rect x="1.5" y="1.5" width="5.5" height="5.5"/><rect x="9" y="1.5" width="5.5" height="5.5"/><rect x="1.5" y="9" width="5.5" height="5.5"/><rect x="9" y="9" width="5.5" height="5.5"/>',
  clients:'<path d="M2 14V6l6-4 6 4v8"/><path d="M6 14v-4h4v4"/>',
  tasks:'<path d="M2 4.5l1.5 1.5L6 3.5M2 9.5l1.5 1.5L6 8.5"/><path d="M8 4.5h6M8 9.5h6"/>',
  calendar:'<rect x="2" y="3" width="12" height="11"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/>',
  email:'<rect x="1.5" y="3" width="13" height="10"/><path d="M1.5 4l6.5 4.5L14.5 4"/>',

  'tax-optimisation':'<path d="M3 13L13 3"/><circle cx="4.5" cy="4.5" r="1.8"/><circle cx="11.5" cy="11.5" r="1.8"/>',
  'annual-review':'<rect x="2" y="3" width="12" height="11"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/><path d="M5 10l2 2 4-4"/>',
  'soa-roa':'<path d="M3 1.5h6.5L13 5v9.5H3z"/><path d="M9.5 1.5V5H13"/><path d="M5.5 8.5h5M5.5 11h3.5"/>',
  search:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
};
ICON.settings='<circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>';ICON.soa=ICON['soa-roa'];ICON.roa=ICON['soa-roa'];
const svg=(k,cls='')=>`<svg viewBox="0 0 16 16" class="${cls}" aria-hidden="true">${ICON[k]||''}</svg>`;
/* The Brightday flower, drawn from seven rounded petals with darker overlaps (approximation of the brand mark). */
function flower(id,size){const N=7;let defs='',clips='',body='',over='';for(let i=0;i<N;i++){defs+=`<rect id="${id}p${i}" x="-17" y="-47" width="34" height="31" rx="7" transform="rotate(${(i*360/N).toFixed(3)}) rotate(24 0 -31)"/>`;clips+=`<clipPath id="${id}c${i}"><use href="#${id}p${i}"/></clipPath>`;body+=`<use href="#${id}p${i}" fill="#F50D74"/>`;over+=`<use href="#${id}p${(i+1)%N}" fill="#990A4E" clip-path="url(#${id}c${i})"/>`}
  return`<svg viewBox="-60 -60 120 120" width="${size}" height="${size}" aria-hidden="true"><defs>${defs}${clips}</defs>${body}${over}</svg>`}

/* ================= people ================= */
const USERS={alex:{id:'alex',name:'Adviser',role:'Client manager',title:'Adviser'},sam:{id:'sam',name:'Paraplanner',role:'Paraplanner',title:'Paraplanner'},jordan:{id:'jordan',name:'Practice manager',role:'Admin',title:'Practice manager'}};
const APPROVERS=['Admin','Manager','Client manager'];

/* ================= state ================= */
let S=emptyState();
let UI={signedIn:false,me:'alex',view:'dashboard',params:{},tab:'overview',emailId:1,emailFilter:'all',channel:'para',taskScope:'mine',filters:{},filterFrom:null};
const me=()=>USERS[UI.me];
const client=id=>S.clients.find(c=>c.id===id);
const fum=c=>c.profile.accounts.reduce((s,a)=>s+a.bal,0);
const canApprove=(t)=>t.approval==='data'||APPROVERS.includes(me().role);

function liveUpdate(run,done){if(UI.view==='run'&&UI.params.id===run.id){done?render():renderFeed(run)}else if(done&&['tools','dashboard'].includes(UI.view))render()}

/* ================= navigation ================= */
function go(view,params={}){UI.view=view;UI.params=params;if(view==='client')UI.tab=params.tab||'overview';render();window.scrollTo(0,0)}
const NAV=[['dashboard','Dashboard'],['clients','Clients'],['tasks','Tasks'],['calendar','Calendar'],['email','Email'],['chat','Chat']];
function counts(){return{tasks:S.tasks.filter(t=>!t.done&&t.who===UI.me&&daysTo(t.due)<=0).length,email:S.emails.filter(e=>e.unread).length,chat:S.messages.filter(m=>m.when>S.read[m.ch]&&m.who!==UI.me).length,tools:S.runs.filter(r=>r.status==='review'&&canApprove(TOOL[r.tool])).length,calendar:S.events.filter(e=>daysTo(e.s)===0).length}}

function render(){
  const app=$('#app');
  if(!UI.signedIn){app.innerHTML=vLogin();bindLogin();return}
  const n=counts();const active=['client','import'].includes(UI.view)?'clients':['tool','run','tools'].includes(UI.view)?'tools':UI.view;
  const navBtn=(id,label,cnt)=>`<button class="nav" data-go="${id}" ${active===id?'aria-current="page"':''}>${svg(id)}${esc(label)}${cnt?`<span class="count">${cnt}</span>`:''}</button>`;
  app.innerHTML=`<div class="shell"><aside class="rail"><div class="brand">${brightlyMark('r',34)}<b>brightly</b></div>
  <nav><div class="group">Portal</div>${NAV.map(([id,l])=>navBtn(id,l,n[id])).join('')}<div class="group">Advice</div><button class="nav" data-go="ask" ${active==='ask'?'aria-current="page"':''}>${brightlyMark('nv',16)}Ask Brightly</button>${navBtn('tools','Advice tools',n.tools)}${navBtn('settings','Practice settings')}</nav>
  <div class="foot"><div class="who"><span class="av">${initials(me().name)}</span><div><b>${esc(me().name)}</b><span>${esc(me().role)}</span></div></div>
  <label class="switch" for="as">View as<select id="as">${Object.values(USERS).map(u=>`<option value="${u.id}" ${u.id===UI.me?'selected':''}>${esc(u.name)} · ${esc(u.title)}</option>`).join('')}</select></label>
  <button class="nav" id="signout" style="padding-left:0">Sign out</button></div></aside>
  <div class="main"><header class="top"><div class="crumb" id="crumb"></div><div class="sp"></div><div class="search">${svg('search')}<input id="q" placeholder="Smart search, e.g. ART 200k ongoing" aria-label="Smart search: client names, providers, balances, fees, holdings" autocomplete="off" value="${esc(UI.searchQ||'')}"><div class="sdrop" id="sdrop" hidden></div></div>
  <button class="bbtn" id="askbtn" type="button" ${UI.view==='ask'?'aria-current="page"':''}><span class="bdisc">${brightlyMark('sq',28,ASK.status==='thinking')}</span><span class="bl">Ask Brightly</span></button><button class="btn btn-sm btn-quiet" id="theme" type="button">Theme</button></header>
  <main class="page" id="page"></main></div></div>`;
  $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $('#as').onchange=e=>{UI.me=e.target.value;toast('Now viewing as '+me().name);render()};
  $('#signout').onclick=()=>{UI.signedIn=false;render()};
  $('#theme').onclick=()=>{const r=document.documentElement;const cur=r.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark')};

/* ================= Ask Brightly: filters, opportunities and Pearl research ================= */

/* Research ratings are loaded from a CSV (Pearl or other research); none are built in. */
const PEARL={};
const RATINGS=['Buy','Accumulate','Hold','Reduce','Sell'];
const ratingCls=r=>['Buy','Accumulate'].includes(r)?'good':['Reduce','Sell'].includes(r)?'bad':'';
const pearlChip=code=>PEARL[code]?chip('Pearl '+PEARL[code].rating,ratingCls(PEARL[code].rating)):'';
const holdings=c=>c.profile.accounts.flatMap(a=>(a.hold||[]).map(([code,name,val])=>({code,name,val,acct:a})));
const providers=()=>[...new Set(S.clients.flatMap(c=>c.profile.accounts.map(a=>a.p)))].sort();
const pct1=x=>(x*100).toFixed(1).replace(/\.0$/,'')+'%';
const inFlight=cid=>S.runs.find(r=>r.client===cid&&['review','running','queued'].includes(r.status));
const emailClient=e=>e.c||(S.clients.find(c=>c.name.split(/[\s&]+/).includes(e.from.split(' ').pop()))||{}).id||null;

/* Rule checks over profiles, research, email and tasks. Brightly (Claude) ranks and explains these; without
   Claude they are shown as they are. */
function signals(){
  const out=[];const add=o=>out.push({id:o.c+':'+o.key,...o});
  for(const c of S.clients){const p=c.profile,H=holdings(c),run=inFlight(c.id);const first=c.name.split(/[\s&]+/)[0];

      add({c:c.id,key:'dash',kind:'Fees',score:run?40:88,tool:'soa',value:f.saving,title:`Moving to DASH could save ${money(f.saving)} a year`,

    if(p.parcels&&p.realised>0){const h=harvest(c);if(h.lossTotal>0){

        ev:[`${h.name} in ${h.acct.p} · ${h.acct.prod}`,`Pearl ${r.rating}, ${fmtShort(r.date)}`]})}

    const supers=p.accounts.filter(a=>a.kind==='Super');const small=supers.filter(a=>a.bal<20000&&supers.some(b=>b!==a&&b.owner===a.owner));

        ev:[...p.goals.filter(g=>/retire/i.test(g)),...(e?[`Unanswered email: “${e.s}”, ${rel(e.when)}`]:[])]})}
    for(const e of S.emails.filter(e=>e.unread&&emailClient(e)===c.id&&!out.some(s=>s.email===e.id)))

      title:'Estate plan for the fund’s property',why:'The trustees want to plan how the property passes to the children; binding nominations and the fund deed are worth a review with their lawyer.',ev:p.goals.filter(g=>/passes to|estate/i.test(g))});
    for(const f of p.flags.filter(f=>f.s==='block'))add({c:c.id,key:'block',kind:'Data',score:32,tool:'client-profile',value:null,
      title:`Resolve ${first}’s profile before advice`,why:f.m,ev:['The profile cannot be confirmed until this is answered.']});
  }
  return out.sort((a,b)=>b.score-a.score);
}

/* Filters shared by the Clients page and Brightly. */
const ALIAS={art:'Australian Retirement Trust','aus super':'AustralianSuper','australian super':'AustralianSuper',bt:'BT Panorama',panorama:'BT Panorama',rest:'Rest'};
const FEE_TYPES=['Ongoing','Fixed term'],RISKS=['Balanced','Growth','High Growth'],CTYPES=['Individual','Couple','SMSF'],KINDS=['Super','SMSF','Wrap','Property'];
const NUMF=['minBalance','maxBalance','minFunds','maxFunds','reviewWithinDays','ofaWithinDays'];
const pick=(v,list)=>list.find(x=>x.toLowerCase()===String(v).trim().toLowerCase())||null;
function parseMoney(v){const m=String(v).replace(/[\s,$]/g,'').match(/^(\d+(?:\.\d+)?)(k|m|mil|million)?$/i);if(!m)return null;return Math.round(+m[1]*({k:1e3,m:1e6,mil:1e6,million:1e6}[(m[2]||'').toLowerCase()]||1))}
const shortMoney=n=>n>=1e6?+(n/1e6).toFixed(2)+'m':n>=1e3?+(n/1e3).toFixed(1)+'k':String(n);
function cleanFilters(f){const o={};if(!f||typeof f!=='object')return o;
  if(typeof f.provider==='string'&&f.provider.trim()){const s=f.provider.trim();o.provider=ALIAS[s.toLowerCase()]||pick(s,providers())||s}
  for(const[k,list]of[['accountKind',KINDS],['feeType',FEE_TYPES],['risk',RISKS],['clientType',CTYPES],['pearl',RATINGS],['profile',['confirmed','draft']]])if(f[k]!=null&&pick(f[k],list))o[k]=pick(f[k],list);
  if(typeof f.holding==='string'&&f.holding.trim())o.holding=f.holding.trim().toUpperCase();
  for(const k of NUMF)if(f[k]!=null&&f[k]!==''){const n=typeof f[k]==='number'?f[k]:parseMoney(f[k]);if(Number.isFinite(n)&&n>=0)o[k]=n}
  return o}
const acctCrit=f=>!!(f.provider||f.accountKind||f.minBalance!=null||f.maxBalance!=null);
function matchClient(c,f){const p=c.profile;
  const provOk=a=>{const q=f.provider.toLowerCase();return a.p.toLowerCase().includes(q)||a.prod.toLowerCase().includes(q)};
  const accts=p.accounts.filter(a=>(!f.provider||provOk(a))&&(!f.accountKind||a.kind===f.accountKind)&&(f.minBalance==null||a.bal>=f.minBalance)&&(f.maxBalance==null||a.bal<f.maxBalance));
  if(acctCrit(f)&&!accts.length)return null;
  const H=holdings(c).filter(h=>(!f.holding||h.code===f.holding)&&(!f.pearl||PEARL[h.code]?.rating===f.pearl));
  if((f.holding||f.pearl)&&!H.length)return null;
  if(f.minFunds!=null&&fum(c)<f.minFunds)return null;
  if(f.maxFunds!=null&&fum(c)>=f.maxFunds)return null;
  if(f.feeType&&c.feeType!==f.feeType)return null;
  if(f.risk&&p.risk!==f.risk)return null;
  if(f.clientType&&c.type!==f.clientType)return null;
  if(f.reviewWithinDays!=null&&daysTo(c.nextReview)>f.reviewWithinDays)return null;
  if(f.ofaWithinDays!=null&&daysTo(c.ofa)>f.ofaWithinDays)return null;
  if(f.profile&&p.status!==f.profile)return null;
  return{accts:acctCrit(f)?accts:[],H:(f.holding||f.pearl)?H:[]}}

/* The built-in reading of a question, used when Claude is not available in this view. */
/* Smart search: key terms and numbers to filters, worked out in the page (no AI). */
function smartFilters(q){
  const s=q.toLowerCase();const f={};
  for(const[k,v]of Object.entries(ALIAS))if(new RegExp('\\b'+k+'\\b').test(s))f.provider=v;
  for(const p of providers())if(s.includes(p.toLowerCase()))f.provider=p;
  if(/\bwrap\b|platform account/.test(s))f.accountKind='Wrap';else if(/propert/.test(s))f.accountKind='Property';else if(/\bsuper\b|superannuation/.test(s.replace(/australian ?super/g,'')))f.accountKind='Super';
  const m=s.match(/(under|below|less than|over|above|more than|at least|greater than)?\s*\$\s?(\d[\d,.]*\s*(?:k|m|million)?)|(under|below|less than|over|above|more than|at least|greater than)?\s*\b(\d[\d,.]*\s*(?:k|m|million))\b/);
  if(m){const amt=parseMoney(m[2]||m[4]);const dir=m[1]||m[3]||'';if(amt){const acct=f.provider||f.accountKind||/account|balance/.test(s);f[/under|below|less/.test(dir)?(acct?'maxBalance':'maxFunds'):(acct?'minBalance':'minFunds')]=amt}}
  if(/ongoing/.test(s))f.feeType='Ongoing';else if(/fixed[- ]term/.test(s))f.feeType='Fixed term';
  if(/high growth/.test(s))f.risk='High Growth';else if(/\bgrowth\b/.test(s))f.risk='Growth';else if(/\bbalanced\b/.test(s))f.risk='Balanced';
  if(/\bsmsf/.test(s))f.clientType='SMSF';else if(/couple/.test(s))f.clientType='Couple';else if(/individual|single/.test(s))f.clientType='Individual';
  const codes=[...new Set(S.clients.flatMap(c=>holdings(c).map(h=>h.code)))].filter(x=>x!=='Cash');
  for(const code of codes)if(new RegExp('\\b'+code+'\\b','i').test(q))f.holding=code;
  {const r=s.match(/(?:rates?|rated|rating|pearl)\s+(?:it\s+|them\s+|as\s+|a\s+)?(buy|accumulate|hold|reduce|sell)\b|\b(buy|accumulate|hold|reduce|sell)[- ]rated/)||s.match(/\b(buy|accumulate|reduce|sell)s?\b/);if(r)f.pearl=pick(r[1]||r[2],RATINGS)}
  const d=s.match(/(\d+)\s*days/);const wk=/this month|next month/.test(s)?30:null;
  if(/renewal|ofa/.test(s))f.ofaWithinDays=d?+d[1]:wk||30;else if(/review/.test(s))f.reviewWithinDays=d?+d[1]:wk||30;
  if(/draft|unconfirmed|to confirm/.test(s))f.profile='draft';else if(/confirmed profile/.test(s))f.profile='confirmed';
  return cleanFilters(f)}
function localAnswer(q){const s=q.toLowerCase();const sig=signals();
  const asItems=list=>list.map(x=>({...x,size:x.score>=75?'high':x.score>=50?'medium':'low'}));
  if(/dash|sav(e|ing)|fee|cheaper|switch/.test(s)&&!/ongoing fee/.test(s))return{kind:'insights',title:'Savings from moving to DASH',items:asItems(sig.filter(x=>x.kind==='Fees'))};
  if(/tax|harvest|30 june|capital gain|cgt/.test(s))return{kind:'insights',title:'Tax opportunities',items:asItems(sig.filter(x=>['Tax','Contributions'].includes(x.kind)))};
  if(/opportunit|value|connect|priorit|idea|who should i|reach out|call first|focus/.test(s))return{kind:'insights',title:'Opportunities to connect and add value',items:asItems(sig.slice(0,6))};
  if(/email|repl|respond|unanswered/.test(s)){const un=S.emails.filter(e=>e.unread&&emailClient(e));return{kind:'answer',title:'Waiting for a reply',text:un.length?un.map(e=>`${e.from} (${client(emailClient(e)).name}): “${e.s}”, ${rel(e.when)}.`).join('\n'):'Every client email has been read.',clients:[...new Set(un.map(emailClient))]}}
  const clean=smartFilters(q);
  if(Object.keys(clean).length)return{kind:'filter',title:q,explain:'',filters:clean};
  const named=S.clients.filter(c=>c.name.toLowerCase().split(/[\s&]+/).some(w=>w.length>2&&s.includes(w)));
  if(named.length)return{kind:'answer',title:'Clients mentioned',text:'Open a client to see their profile, email, tasks and advice runs.',clients:named.map(c=>c.id)};
  return{kind:'answer',title:'Try asking another way',text:'In quick mode, Brightly understands filters (provider, balance, fee arrangement, risk profile, holdings, Pearl ratings, review and renewal dates) and questions about opportunities, tax and email. Try one of the suggestions above.',clients:[]}}

const BRIGHTLY=`You are Brightly, the assistant inside Brightly, the adviser portal of Brightday (an Australian financial advice practice). An adviser typed a question into the portal. Answer it from DATA only.

Reply with only one JSON object, in one of these shapes:

1. The question asks to show, list or find clients by attributes:
{"kind":"filter","title":"<short title>","explain":"<one sentence on how you read the question>","filters":{...}}
Filter keys (only those the question needs): provider (an account provider as written in DATA; ART = Australian Retirement Trust), accountKind ("Super"|"SMSF"|"Wrap"|"Property"), minBalance and maxBalance (dollars, for one account; they combine with provider and accountKind on the same account), minFunds and maxFunds (dollars, a client's total), feeType ("Ongoing"|"Fixed term"), risk ("Balanced"|"Growth"|"High Growth"), clientType ("Individual"|"Couple"|"SMSF"), holding (a holding code, e.g. "CSL"), pearl ("Buy"|"Accumulate"|"Hold"|"Reduce"|"Sell": holds a security Pearl rates that way), reviewWithinDays, ofaWithinDays (numbers), profile ("confirmed"|"draft").
Example: "show me all the ART clients with 200k balance on ongoing fees" -> {"kind":"filter","title":"ART accounts of $200k+ on ongoing fees","explain":"An Australian Retirement Trust account of at least $200,000, for clients on an ongoing fee arrangement.","filters":{"provider":"Australian Retirement Trust","minBalance":200000,"feeType":"Ongoing"}}

2. The question asks for opportunities, priorities, ideas, or who to contact:
{"kind":"insights","title":"<short title>","items":[{"client":"<client id>","title":"<the opportunity, one line>","why":"<one or two plain-English sentences with the figures from DATA>","evidence":["<fact from DATA>"],"tool":"<tool id or null>","signal":"<signal id or null>","size":"high"|"medium"|"low"}]}
Up to 6 items, best first. Start from DATA.signals (the portal's rule checks), but judge them: merge duplicates, drop weak ones, add what they miss. Rank by value to the client and timeliness. Say where a Pearl rating matters.

3. Anything else:
{"kind":"answer","title":"<short title>","text":"<plain-English answer, at most 120 words>","clients":["<client id>"]}

Rules: use only figures in DATA and never invent a balance, price or rating. Pearl ratings are sample data. Write for the adviser. Say what to look at, not "you should buy". You are Brightly: never refer to yourself by any other name or mention the model or company behind you.`;
function cleanAnswer(r){if(!r||typeof r!=='object')return null;
  if(r.kind==='filter'){const f=cleanFilters(r.filters);return Object.keys(f).length?{kind:'filter',title:String(r.title||''),explain:String(r.explain||''),filters:f}:null}
  if(r.kind==='insights'&&Array.isArray(r.items)){const sig=signals();
    const items=r.items.filter(i=>i&&client(i.client)).slice(0,8).map(i=>{const s=sig.find(x=>x.id===i.signal);return{c:i.client,kind:s?.kind||'Idea',title:String(i.title||s?.title||''),why:String(i.why||s?.why||''),
      ev:Array.isArray(i.evidence)?i.evidence.map(String).slice(0,5):(s?.ev||[]),tool:TOOL[i.tool]?i.tool:(s?.tool||null),email:s?.email,size:['high','medium','low'].includes(i.size)?i.size:'medium'}}).filter(i=>i.title);
    return items.length?{kind:'insights',title:String(r.title||'Opportunities'),items}:null}
  if(r.kind==='answer'&&typeof r.text==='string')return{kind:'answer',title:String(r.title||'Answer'),text:r.text,clients:(Array.isArray(r.clients)?r.clients:[]).filter(id=>client(id))};
  return null}

function leftovers(v){const known=new Set([...VOCAB,...Object.keys(ALIAS).flatMap(k=>k.split(' ')),...providers().flatMap(p=>p.toLowerCase().split(/\s+/)),...S.clients.flatMap(c=>c.name.toLowerCase().split(/[\s&]+/)),...S.clients.flatMap(c=>holdings(c).map(h=>h.code.toLowerCase()))]);

function searchPlan(v){const q=v.trim().toLowerCase();if(!q)return[];const out=[];const f=smartFilters(v);
  const neg=(v.toLowerCase().replace(/’/g,"'").match(/\b(not|no|never|without|except|excluding|neither|nor|(?:have|has|had|do|does|did|is|are|wo|ca)n'?t)\b/)||[])[0];
  if(Object.keys(f).length){const n=S.clients.filter(c=>matchClient(c,f)).length;out.push({act:'filter',f,n,left:leftovers(v),neg})}
  if(neg)out.unshift({act:'ask',neg});
  for(const c of S.clients.filter(c=>c.name.toLowerCase().includes(q)||c.name.toLowerCase().split(/[\s&]+/).some(w=>w.length>2&&q.split(/\s+/).includes(w))).slice(0,5))out.push({act:'client',c});

/* The current cost of one account: from its fee rates when known, else the fees shown on the statement. */
function currentCost(a,f){f=f||a.fees||{};const bal=a.bal||0;
  const inv=(f.investmentPct||0)*bal,admin=(f.adminPct||0)*bal,fixed=f.adminFixed||0,er=(f.erPct||0)*bal;
  const rated=f.investmentPct!=null||f.adminPct!=null||f.adminFixed!=null||f.erPct!=null;
  const other=!rated&&f.paid!=null?f.paid:0;
  return{inv,admin,fixed,er,other,total:inv+admin+fixed+er+other,known:rated||f.paid!=null}}

function dashCost(a,port){const P=dashFor(a),bal=a.bal||0;let admin=tiered(bal,P.tiers);if(P.cap)admin=Math.min(admin,P.cap);
  const inv=bal*port.icr,er=bal*P.er,mdaAdmin=port.op?DASHP.mda.admin:0,mdaProv=port.op?bal*DASHP.mda.provider:0,mdaMgmt=bal*port.mgmt;
  return{product:P.name,admin,er,inv,mdaAdmin,mdaProv,mdaMgmt,sub:admin+er+inv,mda:mdaAdmin+mdaProv+mdaMgmt,total:admin+er+inv+mdaAdmin+mdaProv+mdaMgmt,estab:bal*(port.brok+port.bs)}}
function feeCompare(c,accIds,portName,overrides={}){
  const port=pearl(portName)||pearl(defaultPortfolio(c));
  const rows=c.profile.accounts.filter(a=>accIds.includes(a.id)).map(a=>({a,cur:currentCost(a,overrides[a.id]),rec:dashCost(a,port)}));
  const sum=(side,k)=>rows.reduce((s,r)=>s+(r[side][k]||0),0);
  const bal=rows.reduce((s,r)=>s+(r.a.bal||0),0);
  const cur={inv:sum('cur','inv'),admin:sum('cur','admin'),fixed:sum('cur','fixed'),er:sum('cur','er'),other:sum('cur','other'),total:sum('cur','total')};
  const rec={admin:sum('rec','admin'),er:sum('rec','er'),inv:sum('rec','inv'),mdaAdmin:sum('rec','mdaAdmin'),mdaProv:sum('rec','mdaProv'),mdaMgmt:sum('rec','mdaMgmt'),sub:sum('rec','sub'),total:sum('rec','total'),estab:sum('rec','estab')};
  const products=[...new Set(rows.map(r=>r.rec.product))];
  return{port,rows,bal,cur,rec,products,saving:Math.round(cur.total)-Math.round(rec.total),missing:rows.filter(r=>!r.cur.known).map(r=>r.a)}}

/* ================= client pack: everything in one encrypted file on the adviser's computer ================= */
const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode(...u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function packKey(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:250000},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function packEncrypt(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},await packKey(pass,salt),new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({brightly:'client-pack',v:1,kdf:'PBKDF2-SHA256-250000',salt:b64(salt),iv:b64(iv),data:b64(data)})}
async function packDecrypt(text,pass){const p=JSON.parse(text);if(p.brightly!=='client-pack')throw new Error('This is not a Brightly client pack.');
  let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p.iv)},await packKey(pass,unb64(p.salt)),unb64(p.data))}catch{throw new Error('Wrong passphrase, or the file is damaged.')}
  return JSON.parse(new TextDecoder().decode(plain),(k,v)=>typeof v==='string'&&/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d+)?Z$/.test(v)?new Date(v):v)}

/* ================= import: read files in the browser, Brightly sorts them and builds profiles ================= */
const DOCS={};let DOCSEQ=0;               // id -> {id,name,ext,size,text,pages,sheets,header,rows,images,note,error,client,parent}
const DOC_CAP=60000,PROMPT_CAP=230000;    // characters per document, and bytes per Brightly call
const TEXT_EXT=['txt','md','vtt','srt','eml','json','xml','html','htm','rtf'];
const SHEET_EXT=['csv','tsv','xlsx','xls','xlsm'];
const IMG_EXT=['png','jpg','jpeg','webp','gif'];
const AV_EXT=['mp3','m4a','wav','mp4','mov','webm','aac','ogg'];
function cleanText(ext,t){if(['html','htm'].includes(ext))t=t.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi,'').replace(/<[^>]+>/g,' ');
  if(['vtt','srt'].includes(ext))t=t.replace(/^\d+\s*$/gm,'').replace(/^[\d:.,]+\s*-->\s*[\d:.,]+.*$/gm,'').replace(/^WEBVTT.*$/m,'');
  if(ext==='rtf')t=t.replace(/\\[a-z]+-?\d* ?|[{}]/g,'');
  return t.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim()}
async function readFile(f){const ext=(f.name.split('.').pop()||'').toLowerCase();
  const d={id:'D'+(++DOCSEQ),name:f.name,ext,size:f.size,text:'',pages:null,images:[],note:'',error:null,client:null};
  try{
    if(TEXT_EXT.includes(ext))d.text=cleanText(ext,await f.text());
    else if(SHEET_EXT.includes(ext)){await lib('xlsx');const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});d.sheets=[];
      for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).filter(r=>r.some(v=>String(v).trim()));if(rows.length)d.sheets.push({n,rows})}
      const first=d.sheets[0];if(first){const hi=first.rows.findIndex(r=>r.filter(v=>String(v).trim()).length>=2);d.header=first.rows[Math.max(hi,0)];d.rows=first.rows.slice(Math.max(hi,0)+1)}
      d.text=d.sheets.map(s=>(d.sheets.length>1?`## Sheet: ${s.n}\n`:'')+s.rows.map(r=>r.map(v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\n')).join('\n\n');
      d.note=d.rows?`${d.rows.length} rows`:''}
    else if(ext==='docx'){await lib('mammoth');d.text=cleanText(ext,(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value)}
    else if(ext==='pdf'){await lib('pdf');const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;d.pages=pdf.numPages;const out=[];
      for(let i=1;i<=Math.min(pdf.numPages,80);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out.push(`--- page ${i} ---\n`+tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join(''))}
      d.text=cleanText(ext,out.join('\n'));
      if(d.text.replace(/--- page \d+ ---/g,'').trim().length<40*Math.min(pdf.numPages,3)){d.note='Scanned: Brightly looks at the first pages as images';
        for(let i=1;i<=Math.min(pdf.numPages,3);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
          await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;d.images.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)))}}}
    else if(IMG_EXT.includes(ext)){d.images=[f];d.note='Image: Brightly looks at it'}
    else if(AV_EXT.includes(ext)){d.skip=true;d.note='Recordings can’t be read here. Add the call transcript instead.'}
    else if(ext==='doc'){d.skip=true;d.note='Old Word format: save it as .docx and add it again.'}
    else{d.text=cleanText('txt',await f.text());d.note='Read as plain text'}
  }catch(e){d.error=e.message||'Could not read this file';d.skip=true}
  if(d.text.length>DOC_CAP){d.text=d.text.slice(0,DOC_CAP);d.note=(d.note?d.note+' · ':'')+'Long: only the first part is read'}
  if(!d.skip&&!d.text&&!d.images.length){d.skip=true;d.note=d.note||'Nothing readable in this file'}
  DOCS[d.id]=d;return d}
const docKind=d=>d.parent?'CSV rows':d.ext.toUpperCase()+(d.pages?` · ${d.pages} page${d.pages>1?'s':''}`:'');
const byteLen=s=>new TextEncoder().encode(s).length;

Rules:
- Use only what the documents say. Use null when something is not stated. Never estimate a number.
- Percentages as decimals (0.35% is 0.0035). Dollar amounts as plain numbers.
- Cite every balance in "source" with an exact short quote.
- When documents disagree, use the more recent or more authoritative figure and add a "warn" flag naming both. If you cannot tell which is right, add a "block" flag.
- Record insurance held inside super every time: the practice is not advising on insurance for now, and moving the account would affect the cover.
- List holdings from holdings or CGT reports (up to 40 per account), with cost base and acquisition date when shown.
- From file notes and transcripts take objectives, preferences, instructions and dates. Leave out personal remarks that do not bear on the advice.

  document.body.append(d);d.showModal();const inp=$('#dlgin',d);inp.focus();inp.select();

function tiered(bal,tiers){let fee=0,prev=0;for(const[up,r]of tiers){if(bal<=prev)break;fee+=(Math.min(bal,up)-prev)*r;prev=up}return fee}
/* Capital gains: a simple estimate, with the rate and discount the adviser can change. */
function taxRateFor(c){if(['SMSF'].includes(c.type)||c.profile.accounts.every(a=>isSuperKind(a.kind)||a.kind==='SMSF'))return .15;if(c.type==='Company')return .25;
  const inc=Math.max(0,...c.profile.people.map(x=>x.income||0));return inc>190000?.47:inc>135000?.39:inc>45000?.32:inc>18200?.18:0}
const discFor=c=>['SMSF'].includes(c.type)||c.profile.accounts.every(a=>isSuperKind(a.kind)||a.kind==='SMSF')?1/3:c.type==='Company'?0:.5;
function harvest(c,o={}){const p=c.profile;const rate=o.rate??taxRateFor(c),disc=o.disc??discFor(c),realised=o.realised??p.realised??0,brok=o.brok??.0011;
  const rows=(p.parcels||[]).filter(x=>!o.acc||x[6]===o.acc).map(([code,name,acq,units,cost,val])=>{const d=isoDate(acq);const days=d?Math.round((NOW-d)/864e5):null;return{code,name,acq:d,units,cost,val,g:val-cost,disc:days!=null&&days>365,cost2:val*brok}});
  const losses=rows.filter(r=>r.g<0),gains=rows.filter(r=>r.g>0);const lossTotal=-losses.reduce((s,r)=>s+r.g,0);
  const offset=Math.min(lossTotal,realised||0);const saved=offset*(1-disc)*rate;const costs=losses.reduce((s,r)=>s+r.cost2,0);
  return{rows,losses,gains,lossTotal,offset,saved,costs,rate,disc,realised,brok}}

async function loadResearch(file){try{await lib('xlsx');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const key=(r,...names)=>{const k=Object.keys(r).find(k=>names.some(n=>k.trim().toLowerCase().includes(n)));return k?String(r[k]).trim():''};let n=0;
    for(const r of rows){const code=key(r,'code','ticker','asx','apir').toUpperCase();const rating=pick(key(r,'rating','recommendation','signal','call'),RATINGS);if(!code||!rating)continue;
      const up=num(key(r,'upside','target %'));PEARL[code]={name:key(r,'name','security','company')||code,type:key(r,'type','class'),rating,upside:up==null?null:Math.abs(up)>1?up/100:up,date:isoDate(key(r,'date'))||new Date(),note:key(r,'note','comment','summary','rationale')};n++}
    toast(n?`Loaded ${n} rating${n>1?'s':''}`:'No ratings found. The CSV needs a code column and a rating column (Buy, Accumulate, Hold, Reduce or Sell).');render()}
  catch(e){toast('Could not read that file: '+(e.message||e))}}

function vTasks(){
  crumb([['Tasks']]);
  const list=S.tasks.filter(t=>UI.taskScope==='all'||t.who===UI.me);
  const open=list.filter(t=>!t.done).sort((a,b)=>a.due-b.due);
  const groups=[['Overdue',open.filter(t=>daysTo(t.due)<0),'over'],['Today',open.filter(t=>daysTo(t.due)===0)],['This week',open.filter(t=>daysTo(t.due)>0&&daysTo(t.due)<=7)],['Later',open.filter(t=>daysTo(t.due)>7)],['Done',list.filter(t=>t.done)]].filter(g=>g[1].length);
  P(`<div class="head"><div><h1>Tasks</h1><p class="sub">${open.length} open. Advice runs add their own follow-ups here.</p></div><div class="actions"><button class="btn ${UI.taskScope==='mine'?'btn-primary':''}" data-scope="mine">Mine</button><button class="btn ${UI.taskScope==='all'?'btn-primary':''}" data-scope="all">Everyone</button></div></div>

  <section class="card">${groups.map(([l,ts,cls])=>`<div class="grouphead ${cls||''}"><span>${l}</span><span>${ts.length}</span></div><ul class="list">${ts.map(taskRow).join('')}</ul>`).join('')||'<div class="empty">No tasks.</div>'}</section>`);
  $$('[data-scope]').forEach(b=>b.onclick=()=>{UI.taskScope=b.dataset.scope;vTasks()});

    };
}

function runsTable(runs){return runs.length?`<div class="table-wrap"><table><thead><tr><th>Tool</th><th>Client</th><th>Status</th><th>Started by</th><th>Started</th><th class="r">Documents</th></tr></thead><tbody>${runs.map(r=>`<tr class="click" data-run="${r.id}"><td><b>${esc(TOOL[r.tool].name)}</b></td><td>${esc(client(r.client).name)}</td><td>${runChip(r)}</td><td>${esc(r.by)}</td><td>${rel(r.at)}</td><td class="r">${r.docs.length}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No runs yet.</div>'}

function vTools(){
  crumb([['Advice tools']]);
  P(`<div class="head"><div><h1>Advice tools</h1><p class="sub">Build the client profile from their documents first; every other tool starts from it. Advice documents stay drafts until an adviser approves them.</p></div></div>
  <section class="tools">${TOOLS.map(t=>`<button class="tool ${t.id==='client-profile'?'first':''}" data-tool="${t.id}" data-for="${UI.params.client||''}"><span class="ico">${svg(t.id)}</span><h3>${esc(t.name)}</h3><p>${esc(t.short)}</p>${t.id==='client-profile'?`<div>${chip('Start here','brand')}</div>`:t.approval==='advice'?`<div>${chip('Adviser sign-off','brand')}</div>`:''}<div class="outs">${t.outs.map(o=>`<span>${esc(o)}</span>`).join('')}</div></button>`).join('')}</section>
  <section class="card"><div class="card-head"><h2>Recent runs</h2><span class="label">Whole practice</span></div>${runsTable(S.runs)}</section>`);
  bindGo();
}

function renderFeed(run){const f=$('#feed');if(!f)return;f.innerHTML=run.events.map(e=>`<li class="k-${e.k}"><time>${e.at.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}</time><span class="d"></span><span class="m">${esc(e.m)}</span></li>`).join('');f.scrollTop=f.scrollHeight}
function vRun(){
  const run=S.runs.find(r=>r.id===UI.params.id);if(!run)return go('tools');
  const t=TOOL[run.tool],c=client(run.client),live=['queued','running'].includes(run.status);
  crumb([['Advice tools','tools'],[t.name+' · '+c.name]]);
  const ok=canApprove(t);
  const blocks=t.id==='client-profile'?c.profile.flags.filter(f=>f.s==='block'):[];
  const docs=run.docs.map((d,i)=>{const review=d.st==='draft'&&ok;return`<div class="doc"><span class="ext">${esc(d.x)}</span><div class="b"><div class="n">${esc(d.n)}</div><div class="hint">${d.by?`${d.st==='approved'?(t.approval==='data'?'Confirmed':'Approved'):'Sent back'} by ${esc(d.by)}`:d.st==='final'?'Ready':'Draft'}</div>${d.comment?`<div class="hint">“${esc(d.comment)}”</div>`:''}</div>
    <div class="acts">${chip({draft:'Draft',final:'Ready',approved:t.approval==='data'?'Confirmed':'Approved',rejected:'Sent back'}[d.st],{draft:'warn',final:'good',approved:'good',rejected:'bad'}[d.st])}${d.blocks?`<button class="btn btn-sm" data-pv="${i}">Preview</button>`:''}<button class="btn btn-sm" data-dl="${i}">Download</button>${review?`<button class="btn btn-sm btn-good" data-ok="${i}">${t.approval==='data'?(blocks.length?'Confirm anyway':'Confirm profile'):'Approve'}</button><button class="btn btn-sm" data-back="${i}">Send back</button>`:''}</div>
    ${review?`<form hidden data-bf="${i}"><label class="label" for="bc${i}">What needs to change</label><textarea class="textarea" id="bc${i}"></textarea><div class="row"><button class="btn btn-sm btn-primary" type="submit">Send back</button><button class="btn btn-sm btn-quiet" type="button" data-bx>Cancel</button></div></form>`:''}</div>`}).join('');
  let note='';
  if(run.status==='review'&&!ok)note=`<div class="note">Waiting for an adviser to approve these documents. You are viewing as ${esc(me().name)} (${esc(me().role)}); switch back to the adviser in the left bar to approve.</div>`;
  else if(run.status==='review'&&t.approval==='data')note=blocks.length?`<div class="note bad"><b>${blocks.length} blocking issue${blocks.length>1?'s':''}.</b> ${esc(blocks[0].m)} Run the profile again with a correction, or confirm anyway if you have checked it.</div>`:'<div class="note">Check the profile against the documents, then confirm it.</div>';
  else if(run.status==='done'&&t.approval==='data')note=`<div class="note">Confirmed as profile version ${c.profile.version}. The advice tools now start from it for ${esc(c.name)}.</div>`;
  let result='';
  if(!live&&run.result)result=run.result;
  if(!live&&run.checks)result+=`<section class="card"><div class="card-head"><h2>Compliance checks</h2><span class="label">${run.checks.filter(k=>!k.ok).length} to look at</span></div>${run.checks.map(k=>`<div class="flag">${chip(k.ok?'Pass':'Check',k.ok?'good':'warn')}<span><b>${esc(k.label)}</b>${k.detail?` <span class="muted">· ${esc(k.detail)}</span>`:''}</span></div>`).join('')}</section>`;
  if(!live&&run.docs.some(d=>d.blocks))result+=run.docs.map((d,i)=>d.blocks?`<section class="card docprev" id="prev${i}" hidden><div class="card-head"><h2>${esc(d.n)}</h2><button class="btn btn-sm" data-dl="${i}">Download .docx</button></div><div class="card-body doc-body">${docHTML(d.blocks)}</div></section>`:'').join('');
  if(!live&&run.tool==='client-profile'){const p=c.profile;const sevC={block:'bad',warn:'warn',info:'info'},sevL={block:'Blocking',warn:'Check',info:'Note'};
    result=`<section class="card"><div class="card-head"><h2>Profile</h2><span class="label">Position at ${esc(p.asAt)}</span></div><div class="card-body"><dl class="kv"><dt>People</dt><dd>${p.people.map(x=>`${esc(x.n)} <span class="muted">(${esc(x.dob)})</span>`).join(', ')}</dd><dt>Risk profile</dt><dd>${esc(p.risk)}</dd><dt>Documents</dt><dd>${p.docs.length} read</dd></dl></div>
    <div class="table-wrap"><table><thead><tr><th>Account</th><th>Owner</th><th class="r">Balance</th><th>Source</th></tr></thead><tbody>${p.accounts.map(a=>`<tr><td>${esc(a.p)} · ${esc(a.prod)}</td><td>${esc(a.owner)}</td><td class="r">${money(a.bal)}</td><td class="small muted">${esc(a.src)}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td></td><td class="r">${money(fum(c))}</td><td></td></tr></tbody></table></div>
    ${p.flags.length?`<div class="card-head" style="border-top:1px solid var(--line)"><h3>Flags</h3><span class="label">${p.flags.length}</span></div>${p.flags.map(f=>`<div class="flag">${chip(sevL[f.s],sevC[f.s])}<span>${esc(f.m)}</span></div>`).join('')}`:''}
    ${p.gaps.length?`<div class="card-head" style="border-top:1px solid var(--line)"><h3>Missing</h3><span class="label">${p.gaps.length}</span></div>${p.gaps.map(g=>`<div class="flag"><span>${esc(g)}</span></div>`).join('')}`:''}</section>`}
  const inputs=Object.entries(run.inputs||{}).filter(([,v])=>v&&(!Array.isArray(v)||v.length)).map(([k,v])=>`<dt>${esc(((t.fields||[]).find(f=>f.k===k)||{}).label||k)}</dt><dd>${Array.isArray(v)?v.map(esc).join('<br>'):esc(v)}</dd>`).join('');
  P(`<div class="head"><div><div class="row"><h1>${esc(t.name)}</h1>${runChip(run)}</div><p class="sub"><a data-client="${c.id}">${esc(c.name)}</a> · started by ${esc(run.by)} ${rel(run.at)}</p></div>
  <div class="actions">${live?'<button class="btn" id="cancelr">Cancel run</button>':''}<button class="btn" data-tool="${t.id}" data-for="${c.id}">Run again</button></div></div>
  ${note}
  <div class="split"><div class="stack"><section class="card"><div class="card-head"><h2>Progress</h2>${live?chip('Live','brand live'):''}</div><ol class="feed" id="feed"></ol></section></div>
  <div class="stack"><section class="card"><div class="card-head"><h2>Documents</h2><span class="label">${run.docs.length}</span></div>${docs||`<div class="empty">${live?'Documents appear here when the run finishes.':'No documents.'}</div>`}</section>
  ${run.summary?`<section class="card"><div class="card-head"><h2>Summary for the adviser</h2></div><div class="card-body summary">${esc(run.summary).replace(/\[\[CONFIRM:[^\]]*\]\]/g,m=>`<mark>${m}</mark>`)}</div></section>`:''}
  <section class="card"><div class="card-head"><h2>Inputs</h2></div><div class="card-body">${inputs?`<dl class="kv">${inputs}</dl>`:'<span class="muted">None</span>'}</div></section></div></div>${result?`<div class="stack" style="margin-top:20px">${result}</div>`:''}`);
  renderFeed(run);bindGo();
  $('#cancelr')&&($('#cancelr').onclick=()=>{run.ctl&&run.ctl.abort();run.status='cancelled';run.events.push({k:'end',m:'Run cancelled',at:new Date()});toast('Run cancelled');vRun()});
  $$('[data-dl]').forEach(b=>b.onclick=async()=>{const d=run.docs[+b.dataset.dl];b.disabled=true;
    try{if(d.blocks)await saveFile(safeName(d.n)+'.docx',await docxBlob(d.blocks,d.n));else await saveFile(safeName(d.n)+'.json',JSON.stringify({client:c.name,profile:c.profile.raw,confirmed:c.profile.status==='confirmed'},null,2))}catch(e){toast('Could not build the file: '+(e.message||e))}b.disabled=false});
  $$('[data-pv]').forEach(b=>b.onclick=()=>{const el=$('#prev'+b.dataset.pv);el.hidden=!el.hidden;if(!el.hidden)el.scrollIntoView({behavior:'smooth',block:'start'})});
  $$('[data-ok]').forEach(b=>b.onclick=()=>{const d=run.docs[+b.dataset.ok];d.st='approved';d.by=me().name;
    if(run.docs.every(x=>x.st==='approved'||x.st==='final')){run.status='done';run.events.push({k:'end',m:(t.approval==='data'?`Profile confirmed by `:'Approved by ')+me().name,at:new Date()});
      if(t.approval==='data'){const p=c.profile;p.version=(p.version||0)+(p.status==='draft'&&p.version===1&&!p.by?0:1);if(!p.by)p.version=1;p.status='confirmed';p.by=me().name;p.when=new Date()}
      S.tasks.filter(x=>x.c===c.id&&!x.done&&/confirm|approve|sign off/i.test(x.t)).forEach(x=>x.done=true)}
    toast(t.approval==='data'?'Profile confirmed':'Approved');render()});
  $$('[data-back]').forEach(b=>b.onclick=()=>{const f=$(`[data-bf="${b.dataset.back}"]`);f.hidden=false;$('textarea',f).focus()});
  $$('[data-bf]').forEach(f=>{$('[data-bx]',f).onclick=()=>f.hidden=true;f.onsubmit=e=>{e.preventDefault();const cm=$('textarea',f).value.trim();if(!cm)return $('textarea',f).focus();const d=run.docs[+f.dataset.bf];d.st='rejected';d.by=me().name;d.comment=cm;toast('Sent back');render()}});
}

$('#packopen').onclick=packOpen;$('#packsave').onclick=packSave;
$('#reset').onclick=closeAll;
render();
</script>
